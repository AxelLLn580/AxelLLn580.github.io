<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Axel Luna's personal page.">
    <title>Axel Luna</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f6f4ef;
        color: #24332d;
        font-family: system-ui, sans-serif;
      }
      main { width: min(100%, 40rem); }
      h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.1; }
      p { margin: 0; font-size: 1.2rem; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Axel Luna</h1>
      <p>I like chess.</p>
    </main>
  </body>
</html>
